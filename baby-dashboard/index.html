<!doctype html>
<html lang="ko">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#25da42" />
  <title>베이비대시보드 | Sairo Studio</title>
  <meta name="description" content="초대 코드로 가족 모두가 수유와 기저귀, 수면 기록을 한눈에 확인하는 베이비대시보드 소개 페이지" />
  <style>
    :root {
      --bg: #ffffff;
      --ink: #05120a;
      --muted: #5d5d5d;
      --hero-top: #25da42;
      --hero-bottom: #28c8ba;
      --surface: rgba(255, 255, 255, 0.94);
      --shadow: 0 18px 38px rgba(7, 25, 15, 0.14);
      --footer-height: 205px;
      --footer-bottom-padding: 36px;
      --showcase-overlap: 96px;
      --showcase-target-gap: 65px;
      --hero-copy-extra-space: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background-color: var(--hero-top);
      background-image:
        linear-gradient(
          180deg,
          var(--hero-top) 0%,
          var(--hero-bottom) calc(100% - (var(--footer-height) + env(safe-area-inset-bottom))),
          var(--bg) calc(100% - (var(--footer-height) + env(safe-area-inset-bottom))),
          var(--bg) 100%
        );
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background-color: var(--hero-top);
      background-image:
        linear-gradient(
          180deg,
          var(--hero-top) 0%,
          var(--hero-bottom) calc(100% - (var(--footer-height) + env(safe-area-inset-bottom))),
          var(--bg) calc(100% - (var(--footer-height) + env(safe-area-inset-bottom))),
          var(--bg) 100%
        );
      font-family:
        "Pretendard",
        "Avenir Next",
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      isolation: isolate;
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
    }

    .hero {
      position: relative;
      z-index: 1;
      background:
        radial-gradient(circle at center, rgba(255, 255, 255, 0.06), transparent 45%),
        url("/res/Rectangle%201569.png") center top / cover no-repeat,
        linear-gradient(180deg, var(--hero-top) 0%, var(--hero-bottom) 100%);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), transparent 38%);
      pointer-events: none;
    }

    .shell {
      width: min(100%, 1380px);
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding:
        max(22px, env(safe-area-inset-top)) 20px 22px;
      background: rgba(255, 255, 255, 0.1);
    }

    .eyebrow,
    .brand {
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    .eyebrow-logo {
      width: auto;
      height: auto;
      max-height: 16px;
    }

    .brand-logo {
      width: auto;
      height: auto;
      max-height: 16px;
    }

    .hero-copy {
      max-width: 1040px;
      min-height: calc(780px + var(--hero-copy-extra-space));
      margin: 0 auto;
      padding: 38px 20px 0;
      text-align: center;
    }

    .app-icon {
      width: 67px;
      margin: 0 auto clamp(30px, 3vw, 42px);
    }

    .hero-title {
      margin-top: 0px;
      margin-left: 74px;
      margin-right: 74px;
      margin-bottom: 40px;
      max-width: 940px;
      font-size: 48px;
      line-height: 1.28;
      letter-spacing: -0.055em;
      font-weight: bold;
      word-break: keep-all;
      white-space: pre-line;
    }

    .body-copy {
      margin: 0 0 70px;
      color: #ffffff;
      font-size: 24px;
      line-height: 1.5;
      font-weight: 500;
      word-break: keep-all;
      white-space: pre-line;
    }

    .store-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin-top: clamp(42px, 5vw, 56px);
      flex-wrap: wrap;
    }

    .store-badge {
      display: inline-block;
      filter: drop-shadow(0 18px 38px rgba(12, 12, 12, 0.2));
    }

    .store-badge[hidden] {
      display: none;
    }

    .store-badge-image {
      width: clamp(190px, 18vw, 220px);
      height: auto;
    }

    .showcase {
      position: absolute;
      isolation: isolate;
      z-index: 2;
      width: min(100%, 1240px);
      left: 50%;
      bottom: calc(-1 * var(--showcase-overlap));
      padding: 0 clamp(16px, 4vw, 42px);
      transform: translateX(-50%);
    }

    .showcase-bubbles,
    .showcase-babies {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .showcase-bubbles {
      z-index: 1;
    }

    .showcase-babies {
      z-index: 4;
    }

    .showcase-device {
      position: relative;
      z-index: 3;
      width: min(100%, 1030px);
      max-height: 340px;
      max-width: 611px;
      margin: 0 auto;
    }

    .device {
      display: block;
      width: 100%;
      filter: drop-shadow(0 30px 42px rgba(0, 0, 0, 0.16));
    }

    .baby {
      position: absolute;
      z-index: 2;
      pointer-events: none;
      animation: float 5.8s ease-in-out infinite;
    }

    .baby-left {
      width: clamp(74px, 9vw, 108px);
      left: clamp(44px, 7vw, 88px);
      top: 6px;
    }

    .baby-right {
      width: clamp(64px, 8vw, 92px);
      right: clamp(24px, 5vw, 64px);
      top: 104px;
      animation-delay: -2.4s;
    }

    .bubble {
      position: absolute;
      z-index: 1;
      opacity: 0.92;
      pointer-events: none;
      animation: pulse 5s ease-in-out infinite;
    }

    .bubble-a {
      width: clamp(48px, 6vw, 67px);
      left: clamp(60px, 8vw, 114px);
      bottom: 154px;
    }

    .bubble-b {
      width: clamp(18px, 3vw, 29px);
      left: clamp(118px, 12vw, 210px);
      bottom: 212px;
      animation-delay: -1s;
    }

    .bubble-c {
      width: clamp(14px, 2vw, 15px);
      right: clamp(142px, 14vw, 248px);
      bottom: 246px;
      animation-delay: -2.6s;
    }

    .bubble-d {
      width: clamp(20px, 3vw, 27px);
      right: clamp(106px, 11vw, 196px);
      bottom: 208px;
      animation-delay: -0.7s;
    }

    .site-footer {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      min-height: calc(var(--footer-height) + env(safe-area-inset-bottom));
      padding: 0 20px calc(var(--footer-bottom-padding) + env(safe-area-inset-bottom));
      text-align: center;
      color: var(--muted);
      font-size: 16px;
      line-height: 21px;
      background: var(--bg);
    }

    .site-footer strong {
      color: #676767;
      font-weight: 800;
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      animation: reveal 720ms cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
    }

    .reveal-delay-1 {
      animation-delay: 90ms;
    }

    .reveal-delay-2 {
      animation-delay: 180ms;
    }

    .reveal-delay-3 {
      animation-delay: 270ms;
    }

    @keyframes float {

      0%,
      100% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }

      50% {
        transform: translate3d(0, -10px, 0) rotate(2deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 1080px) {
      .hero-copy {
        max-width: 860px;
      }

      .hero-title {
        max-width: 760px;
      }

      .baby-left {
        top: -4px;
      }

      .baby-right {
        top: 118px;
      }
    }

    @media (max-width: 720px) {
      .topbar {
        padding-left: 20px;
        padding-right: 20px;
      }

      .hero-title {
        max-width: 360px;
        font-size: 32px;
        line-height: 1.22;
      }

      .body-copy {
        max-width: 340px;
        margin-left: auto;
        margin-right: auto;
        font-size: 18px;
        line-height: 1.55;
      }

      .store-row {
        flex-direction: column;
        gap: 20px;
      }

      .store-badge {
        width: min(100%, 220px);
      }

      .store-badge-image {
        width: 100%;
      }

      .showcase {
        width: 100%;
        padding: 0 12px;
      }

      .showcase-device {
        width: min(460px, calc(100% + 34px));
        max-width: none;
        margin-left: auto;
        margin-right: auto;
        transform: translateX(4px);
      }

      .baby-left {
        width: 92px;
        left: 18px;
        top: -118px;
      }

      .baby-right {
        width: 114px;
        right: 12px;
        top: -56px;
      }

      .bubble-a {
        width: 76px;
        left: 28px;
        top: -40px;
      }

      .bubble-b {
        width: 34px;
        left: 126px;
        top: -10px;
      }

      .bubble-c {
        width: 56px;
        right: 122px;
        top: -54px;
      }

      .bubble-d {
        width: 28px;
        right: 166px;
        top: -102px;
      }

      .site-footer {
        font-size: 0.9rem;
        line-height: 20px;
      }
    }

    @media (min-width: 721px) {
      :root {
        --footer-height: 314px;
        --showcase-overlap: 184px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .baby,
      .bubble,
      .reveal {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <section class="hero">
      <div class="shell">
        <header class="topbar">
          <div class="eyebrow">
            <img class="eyebrow-logo" src="/res/babydashboard_logo.png" alt="베이비대시보드" />
          </div>
          <a class="brand" href="/" aria-label="Sairo Studio">
            <img class="brand-logo" src="/res/sairostudio_logo.png" alt="" />
          </a>
        </header>

        <main class="hero-copy">
          <img class="app-icon reveal" src="/res/appIcon.png" alt="베이비대시보드 앱 아이콘" />
          <h1 class="hero-title reveal reveal-delay-1">쌍둥이도
            번갈아 볼 필요없이
            한 화면에서 한 번에</h1>
          <p class="body-copy reveal reveal-delay-2">회원가입 없이 초대 코드로 가족 모두!
            수유와 기저귀, 수면 기록을 한눈에 확인하는 베이비대시보드</p>

          <div class="store-row reveal reveal-delay-3" role="group" aria-label="앱 스토어 목록">
            <a class="store-badge" data-store="ios" href="https://apps.apple.com/us/app/baby-dashboard/id6758552709"
              target="_blank" rel="noreferrer">
              <img class="store-badge-image" src="/res/download_on_appstore.png" alt="App Store에서 다운로드" />
            </a>

            <a class="store-badge" data-store="android"
              href="https://play.google.com/store/apps/details?id=com.sairolabs.babydashboard" target="_blank"
              rel="noreferrer">
              <img class="store-badge-image" src="/res/download_on_playstore.png" alt="Google Play에서 다운로드" />
            </a>
          </div>
        </main>
      </div>

      <div class="showcase">
        <div class="showcase-bubbles" aria-hidden="true">
          <img class="bubble bubble-a" src="/res/Ellipse%204.png" alt="" />
          <img class="bubble bubble-b" src="/res/Ellipse%207.png" alt="" />
          <img class="bubble bubble-c" src="/res/Ellipse%2018.png" alt="" />
          <img class="bubble bubble-d" src="/res/Ellipse%2016.png" alt="" />
        </div>
        <div class="showcase-babies" aria-hidden="true">
          <img class="baby baby-left" src="/res/baby2.png" alt="" />
          <img class="baby baby-right" src="/res/baby1.png" alt="" />
        </div>
        <div class="showcase-device">
          <img class="device reveal reveal-delay-3" src="/res/ondevice-example.png" alt="베이비대시보드 앱 화면 미리보기" />
        </div>
      </div>
    </section>

    <footer class="site-footer">
      <strong>사이로스튜디오</strong>
      <span>© Sairo Studio. All rights reserved.</span>
    </footer>
  </div>

  <script>
    function detectExactMobilePlatform() {
      const uaDataPlatform =
        navigator.userAgentData && typeof navigator.userAgentData.platform === "string"
          ? navigator.userAgentData.platform
          : "";

      if (uaDataPlatform === "Android") {
        return "android";
      }

      if (uaDataPlatform === "iOS") {
        return "ios";
      }

      const userAgent = navigator.userAgent || "";

      if (/Android/i.test(userAgent)) {
        return "android";
      }

      if (/(iPhone|iPad|iPod)/i.test(userAgent)) {
        return "ios";
      }

      return null;
    }

    function applyStoreBadgeVisibility() {
      const platform = detectExactMobilePlatform();

      if (!platform) {
        return;
      }

      document.querySelectorAll("[data-store]").forEach((node) => {
        const store = node.getAttribute("data-store");
        node.hidden = store !== platform;
      });
    }

    function syncMobileShowcaseSpacing() {
      const root = document.documentElement;
      const mobileQuery = window.matchMedia("(max-width: 720px)");

      if (!mobileQuery.matches) {
        root.style.setProperty("--hero-copy-extra-space", "0px");
        return;
      }

      const storeRow = document.querySelector(".store-row");
      const leftBaby = document.querySelector(".baby-left");

      if (!storeRow || !leftBaby) {
        return;
      }

      root.style.setProperty("--hero-copy-extra-space", "0px");

      function alignShowcase(attempt) {
        const targetGap =
          parseFloat(getComputedStyle(root).getPropertyValue("--showcase-target-gap")) || 65;
        const currentGap = leftBaby.getBoundingClientRect().top - storeRow.getBoundingClientRect().bottom;
        const currentExtra =
          parseFloat(root.style.getPropertyValue("--hero-copy-extra-space")) || 0;
        const nextExtra = Math.max(0, Math.round(currentExtra + targetGap - currentGap));

        root.style.setProperty("--hero-copy-extra-space", `${nextExtra}px`);

        if (attempt < 3 && Math.abs(currentGap - targetGap) > 1) {
          requestAnimationFrame(() => alignShowcase(attempt + 1));
        }
      }

      requestAnimationFrame(() => alignShowcase(0));
    }

    function syncSafariChromeBackdrop() {
      const footer = document.querySelector(".site-footer");

      if (!footer) {
        return;
      }

      const rootStyles = getComputedStyle(document.documentElement);
      const heroTop = rootStyles.getPropertyValue("--hero-top").trim() || "#25da42";
      const background = rootStyles.getPropertyValue("--bg").trim() || "#ffffff";
      const footerTop = footer.getBoundingClientRect().top;
      const nextColor = footerTop <= window.innerHeight ? background : heroTop;

      document.body.style.backgroundColor = nextColor;
    }

    applyStoreBadgeVisibility();
    syncMobileShowcaseSpacing();

    window.addEventListener("load", syncMobileShowcaseSpacing);
    window.addEventListener("load", syncSafariChromeBackdrop);
    window.addEventListener("scroll", syncSafariChromeBackdrop, { passive: true });
    window.addEventListener("resize", syncSafariChromeBackdrop);
    window.addEventListener("resize", syncMobileShowcaseSpacing);
  </script>
</body>

</html>
